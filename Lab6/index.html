<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vertical Sliding Desktops</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
    <div id="desktop1" class="desktop">
      <div class="content">
        <h1>Introducing the new <b>Iphone 17</b></h1>
        <p>Experience the future of mobile technology.</p>
        <img src="iph.webp" alt="Iphone 17">
      </div>
    </div>
  
    <div id="desktop2" class="desktop">
      <div class="content">
        <h1>Stunning Display</h1>
        <p>6.9" OLED panel with ultra-thin bezels. Pure immersion.</p>
        <img src="chip.webp" alt="Display">
      </div>
    </div>
  
    <div id="desktop3" class="desktop">
      <div class="content">
        <h1>Pro Camera System</h1>
        <p>Capture moments in 8K with cinematic detail.</p>
        <img src="camera.jpg.webp" alt="Camera">
      </div>
    </div>
  
    <div id="desktop4" class="desktop">
      <div class="content">
        <h1>All-Day Battery</h1>
        <p>Stay powered with 5,000 mAh and fast charging.</p>
        <img src="battery.webp.jpeg" alt="Battery">
      </div>
    </div>
  
  </body>
  
</html>
